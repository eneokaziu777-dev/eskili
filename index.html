var mgr=null,miniOn=false;
function setMini(key){if(mgr){MS.remove(mgr);mgr.traverse(function(o){if(o.geometry)o.geometry.dispose()})}mgr=null;miniOn=false;if(!key)return;mgr=new T.Group();S[key](mgr);MS.add(mgr);miniOn=true;sizeMini()}
function sizeMini(){var w=mc.clientWidth,h=mc.clientHeight;if(!w||!h)return;MR.setSize(w,h,false);MC.aspect=w/h;MC.updateProjectionMatrix()}
/* paneli */
var panel=$('#panel'),cur=null;
function open(id){if(!P[id])return;cur=id;panel.classList.add('on');panel.classList.toggle('wide',id==='E'||id==='Q');var b=$('#pbody');b.innerHTML=P[id].html;b.scrollTop=0;$('.art').style.display=P[id].s?'block':'none';setMini(P[id].s);
var i=ORDER.indexOf(id);$('#prev').disabled=i<=0;$('#next').disabled=i>=ORDER.length-1;$('#cnt').textContent=(i+1)+' / '+ORDER.length;focus(id);$('#hint').style.opacity=0;
if(id==='E')initTL();if(id==='Q')initQuiz()}
function closeP(){panel.classList.remove('on');cur=null;miniOn=false;home()}
$('#close').onclick=closeP;$('#reset').onclick=closeP;
$('#prev').onclick=function(){var i=ORDER.indexOf(cur);if(i>0)open(ORDER[i-1])};
$('#next').onclick=function(){var i=ORDER.indexOf(cur);if(i<ORDER.length-1)open(ORDER[i+1])};
document.addEventListener('click',function(e){var b=e.target.closest('[data-open]');if(b)open(b.dataset.open)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur)closeP()});
function initTL(){var el=$('#tl'),col={Jeta:'#c9a24b',Historia:'#4a74c9',Vepra:'#b5532f'};
el.innerHTML='<div class="trk">'+TL.map(function(e,k){return '<button class="dot'+(k===0?' on':'')+'" data-i="'+k+'" style="--c:'+col[e.g]+'"><i></i><span>'+e.y+'</span></button>'}).join('')+'</div><div class="tld" id="tld"></div>';
function show(i){var e=TL[i];$('#tld').innerHTML='<span class="tag" style="background:'+col[e.g]+'">'+e.g+'</span><h4>'+e.y+' p.e.s. · '+e.t+'</h4><p>'+e.p+'</p>'}
show(0);el.querySelector('.trk').onclick=function(ev){var b=ev.target.closest('.dot');if(!b)return;el.querySelectorAll('.dot').forEach(function(d){d.classList.remove('on')});b.classList.add('on');show(+b.dataset.i);b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}}
function initQuiz(){var el=$('#qz'),qs=QZ.map(function(q){return{q:q.q,e:q.e,c:q.o[0],o:shuf(q.o.slice())}}),i=0,sc=0,done=false;
function show(){if(i>=qs.length){var m=sc>=9?"Shkëlqyeshëm! Je njohës i vërtetë i Eskilit.":sc>=6?"Shumë mirë! Rishiko disa degë të hartës për ta përsosur.":"Eksploro hartën 3D dhe provo përsëri.";el.innerHTML='<div class="qp"><i style="width:100%"></i></div><div class="res"><div class="big">'+sc+' / '+qs.length+'</div><p>'+m+'</p><button class="go" id="rs">Provo përsëri</button><p class="by">Punoi: Eneo Kaziu</p></div>';return}
done=false;var q=qs[i];el.innerHTML='<div class="qp"><i style="width:'+i/qs.length*100+'%"></i></div><p class="kick">Pyetja '+(i+1)+' / '+qs.length+'</p><h3 class="qq">'+q.q+'</h3>'+q.o.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o+'</button>'}).join('')+'<div id="qf"></div>'}
el.onclick=function(e){var b=e.target.closest('.opt');if(b&&!done){done=true;var q=qs[i],ok=q.o[+b.dataset.k]===q.c;if(ok)sc++;el.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(q.o[+x.dataset.k]===q.c)x.classList.add('ok')});if(!ok)b.classList.add('bad');$('#qf').innerHTML='<p class="fb"><b>'+(ok?'Saktë.':'Jo saktë. Përgjigja e saktë: '+q.c+'.')+'</b> '+q.e+'</p><button class="go" id="nx">'+(i===qs.length-1?'Shiko rezultatin':'Pyetja tjetër')+'</button>';return}
if(e.target.id==='nx'){i++;show()}if(e.target.id==='rs'){i=0;sc=0;qs.forEach(function(q){shuf(q.o)});show()}};show()}
/* ndërveprimi 3D */
var ray=new T.Raycaster(),pt=new T.Vector2(),hov=null,down=null;
function pick(e){var r=cvs.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pt,cam);var h=ray.intersectObjects(hit,false);return h.length?h[0].object.userData.owner:null}
function setHover(o){if(o===hov)return;if(hov)hov.t=0;hov=o;if(o)o.t=1;cvs.style.cursor=o&&(o.kind==='node'||o.open)?'pointer':'grab'}
cvs.addEventListener('pointermove',function(e){if(e.pointerType!=='touch'&&!(e.buttons))setHover(pick(e))});
cvs.addEventListener('pointerdown',function(e){down=[e.clientX,e.clientY]});
cvs.addEventListener('pointerup',function(e){if(!down)return;var d=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(d>6)return;var o=pick(e);if(o){var id=o.kind==='node'?o.id:o.open;if(id)open(id)}});
function rs(){var w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();sizeMini()}
addEventListener('resize',rs);rs();
var clock=new T.Clock();
function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
nodes.forEach(function(n,i){var lp=clamp((t-n.d)/n.ld,0,1),np=clamp((t-n.d-n.ld)/.7,0,1);var cnt=n.line.geometry.index.count;n.line.geometry.setDrawRange(0,Math.floor(cnt*ease(lp)/3)*3);n.line.visible=lp>0;n.rv=np?back(np):0;n.v+=(n.t-n.v)*.15;n.g.scale.setScalar(Math.max(.001,n.rv*(1+.22*n.v)));n.g.position.y=n.y0+Math.sin(t*1.1+i)*.1;n.halo.rotation.z+=dt*.8;n.core.material.emissiveIntensity=.5+.9*n.v});
glow.forEach(function(o){o.v+=(o.t-o.v)*.15;o.mats.forEach(function(m){m.emissiveIntensity=o.v*.55})});
pts.rotation.y+=dt*.02;
if(tw){tw.k+=dt/tw.d;var k=ease(Math.min(tw.k,1));cam.position.lerpVectors(tw.p0,tw.p1,k);C.target.lerpVectors(tw.t0,tw.t1,k);if(tw.k>=1)tw=null}
C.update();R.render(scene,cam);
if(miniOn&&mgr&&panel.classList.contains('on')){mgr.rotation.y+=dt*.6;MR.render(MS,MC)}}
loop();
var ld=$('#ld');ld.style.opacity=0;setTimeout(function(){ld.style.display='none'},950);
setTimeout(function(){if(!cur)$('#hint').style.opacity=1},4500);$('#hint').style.opacity=0;
}

fontsReady.then(init,init);
})();
